name: Agent PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-gate:
    name: Validate agent-authored changes
    runs-on: ubuntu-latest
    # A human reviewer can wave a PR through by adding the 'human-override' label.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'human-override') }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          # The gate needs the merge base, so shallow clones will not do.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"

      - name: Resolve the gate script from the base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          # Run the validator from the BASE branch, not from the PR head. The
          # policy is already loaded from the base, but the checkout for a
          # pull_request event gives us the PR's copy of the script itself --
          # so a PR that rewrites validate_agent_pr.py down to `sys.exit(0)`
          # would otherwise approve its own changes.
          if git cat-file -e "origin/$BASE:scripts/ci/validate_agent_pr.py" 2>/dev/null; then
            git show "origin/$BASE:scripts/ci/validate_agent_pr.py" > "$RUNNER_TEMP/agent_gate.py"
            echo "Gate script taken from the tip of $BASE."
          else
            echo "::notice::No gate script at the tip of $BASE; bootstrap PR, falling back to the head copy."
            cp scripts/ci/validate_agent_pr.py "$RUNNER_TEMP/agent_gate.py"
          fi

      - name: Validate pull request against base policy
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          python "$RUNNER_TEMP/agent_gate.py" \
            --base "origin/$BASE" \
            --policy scripts/ci/agent_policy.json
