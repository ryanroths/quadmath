name: Sim tests

# Runs every Node test file (tools/test_*.mjs plus sim-tracks-test.mjs) and
# the asset cache-stamp check. Independent of #220 (stamp-on-main).
# Ryan: review before adding any of these as a required check.
#
# Jobs run in parallel and report separately:
#   sim-tests     every test file, with the Chrome map boot skipped (fast).
#   sim-map-boot  tools/test_sim_map_boot.mjs boots every map in headless
#                 Chrome and asserts the FPV screenshot is not blank. One job
#                 per core and shard (SIM_BOOT_CORE, SIM_BOOT_SHARD), so no
#                 job nears its limit as maps are added: add a shard instead.
#                 Each job's summary lists its cases and their times.
#                 GitHub-hosted runners have no GPU: give Chrome
#                 ANGLE/SwiftShader (flags live in the test). three/addons
#                 load from cdn.jsdelivr.net, so this job needs the network.
#                 Its csp entry runs tools/test_sim_csp.mjs instead: the sim
#                 under its Content-Security-Policy in Chrome, both cores and
#                 every open map, rooms and the leaderboard on `wrangler dev`
#                 (installed in that entry). Its own entry, so no map shard
#                 nears 10 minutes. Its page entries run the Chrome parts of
#                 page tests the sim-tests job runs with SKIP_CHROME_BOOT:
#                 test_sim_easy_mode, and test_sim_first_flight with
#                 test_sim_coach_page, each entry under about 10 minutes.
#                 test_sim_sound has no entry for now: it samples the page
#                 once a frame, so its result depends on the frame rate.
#   asset-stamps  scripts/ci/stamp_asset_cache.py --check. The stamper's own
#                 unit tests already run in agent-signals.yml (gate-tests).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sim-tests:
    name: Test sim modules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Globbed so a new tools/test_*.mjs is picked up without editing this
      # file. Each file runs on its own; all run even if one fails.
      - name: Run all Node test files
        env:
          SKIP_CHROME_BOOT: '1'
        run: |
          shopt -s nullglob
          files=(tools/test_*.mjs sim-tracks-test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test files found"
            exit 1
          fi
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            if node "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f::test file failed"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "ran ${#files[@]} file(s), ${#failed[@]} failed"
          for f in "${failed[@]}"; do echo "FAIL $f"; done
          [ "${#failed[@]}" -eq 0 ]

  sim-map-boot:
    name: ${{ matrix.suite == 'csp' && 'Sim under its CSP (Chrome)' || matrix.suite == 'page' && format('Sim page tests in Chrome ({0})', matrix.label) || format('Boot sim maps ({0} core, shard {1}/{2})', matrix.core, matrix.shard, matrix.of) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failing map does not hide the others.
      fail-fast: false
      matrix:
        include:
          # Default core: 21 cases, 7 a shard. The launch-screen checks run in 1/3.
          - { suite: boot, core: bf, shard: 1, of: 3 }
          - { suite: boot, core: bf, shard: 2, of: 3 }
          - { suite: boot, core: bf, shard: 3, of: 3 }
          # ?core=js: 13 cases, 7 and 6.
          - { suite: boot, core: js, shard: 1, of: 2 }
          - { suite: boot, core: js, shard: 2, of: 2 }
          # tools/test_sim_csp.mjs, both cores in one run.
          - { suite: csp, core: both, shard: 1, of: 1 }
          # Page tests' Chrome parts. About 4 and 3.5 minutes on a Windows
          # desktop; split so each entry stays under about 10 here.
          - { suite: page, label: 'easy mode', tests: 'tools/test_sim_easy_mode.mjs' }
          - { suite: page, label: 'first flight, coach', tests: 'tools/test_sim_first_flight.mjs tools/test_sim_coach_page.mjs' }

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Locate Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_BIN" --version
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Boot this shard's maps
        if: matrix.suite == 'boot'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SIM_BOOT_CORE: ${{ matrix.core }}
          SIM_BOOT_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node --test tools/test_sim_map_boot.mjs

      # wrangler for the rooms and leaderboard Workers under `wrangler dev`
      # (tools/sim_rooms_dev.mjs finds it here). Without it the test skips
      # its room and local-Worker steps. Pinned to the version the test was
      # verified with: there is no lockfile, and a new 4.x could change the
      # flags or the "Ready on" line the test waits for.
      - name: Install wrangler
        if: matrix.suite == 'csp'
        working-directory: workers/sim-rooms
        run: npm install --no-audit --no-fund --no-save wrangler@4.151.1

      - name: The sim under its Content-Security-Policy
        if: matrix.suite == 'csp'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node --test tools/test_sim_csp.mjs

      # Each file on its own, Chrome parts included; all run even if one fails.
      - name: This entry's page tests
        if: matrix.suite == 'page'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TESTS: ${{ matrix.tests }}
        run: |
          failed=()
          for f in $TESTS; do
            echo "::group::$f"
            start=$(date +%s)
            if node --test "$f"; then
              echo "PASS $f in $(( $(date +%s) - start )) s"
            else
              echo "::error file=$f::test file failed"
              echo "FAIL $f in $(( $(date +%s) - start )) s"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          for f in "${failed[@]}"; do echo "FAIL $f"; done
          [ "${#failed[@]}" -eq 0 ]

  asset-stamps:
    name: Check asset cache stamps
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check first-party asset stamps
        run: python scripts/ci/stamp_asset_cache.py --check
