name: Sim tests

# Runs every Node test file (tools/test_*.mjs plus sim-tracks-test.mjs) and
# the asset cache-stamp check. Independent of #220 (stamp-on-main).
# Ryan: review before adding any of these as a required check.
#
# Jobs run in parallel and report separately:
#   sim-tests     every test file, with the Chrome map boot skipped (fast).
#   sim-map-boot  tools/test_sim_map_boot.mjs boots every map in headless
#                 Chrome and asserts the FPV screenshot is not blank. One job
#                 per core and shard (SIM_BOOT_CORE, SIM_BOOT_SHARD), so no
#                 job nears its limit as maps are added: add a shard instead.
#                 Each job's summary lists its cases and their times.
#                 GitHub-hosted runners have no GPU: give Chrome
#                 ANGLE/SwiftShader (flags live in the test). three/addons
#                 load from cdn.jsdelivr.net, so this job needs the network.
#                 Its csp entry runs tools/test_sim_csp.mjs instead: the sim
#                 under its Content-Security-Policy in Chrome, both cores and
#                 every open map, rooms and the leaderboard on `wrangler dev`
#                 (installed in that entry). Its own entry, so no map shard
#                 nears 10 minutes. Its page entries run the Chrome parts of
#                 page tests the sim-tests job runs with SKIP_CHROME_BOOT:
#                 test_sim_easy_mode; test_sim_first_flight with
#                 test_sim_coach_page; test_sim_gap_hunt; and
#                 test_sim_speed_units; test_sim_stick_overlay,
#                 test_sim_track_url and
#                 test_sim_track_boards, with test_leaderboard_track_boards
#                 (custom track boards on `wrangler dev` with a real D1,
#                 wrangler installed in that entry, which the sim-tests job
#                 skips for want of wrangler); and test_sim_bf_rates_page
#                 with test_sim_rates_page (Tune's rates on both cores, read
#                 back from Betaflight); and test_sim_race_offer_page (the
#                 race offer and the race count); and test_sim_music (no
#                 audio with the page, each track plays, the credits); and
#                 test_sim_finish_name_page (a finish to a name on a board,
#                 its Worker in the test on a local D1). Each
#                 entry under about 10 minutes.
#                 test_sim_sound has no entry for now: it samples the page
#                 once a frame, so its result depends on the frame rate.
#   asset-stamps  scripts/ci/stamp_asset_cache.py --check. The stamper's own
#                 unit tests already run in agent-signals.yml (gate-tests).

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  sim-tests:
    name: Test sim modules
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Globbed so a new tools/test_*.mjs is picked up without editing this
      # file. Each file runs on its own; all run even if one fails.
      - name: Run all Node test files
        env:
          SKIP_CHROME_BOOT: '1'
        run: |
          shopt -s nullglob
          files=(tools/test_*.mjs sim-tracks-test.mjs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::no test files found"
            exit 1
          fi
          failed=()
          for f in "${files[@]}"; do
            echo "::group::$f"
            if node "$f"; then
              echo "PASS $f"
            else
              echo "::error file=$f::test file failed"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          echo "ran ${#files[@]} file(s), ${#failed[@]} failed"
          for f in "${failed[@]}"; do echo "FAIL $f"; done
          [ "${#failed[@]}" -eq 0 ]

  sim-map-boot:
    name: ${{ matrix.suite == 'csp' && 'Sim under its CSP (Chrome)' || matrix.suite == 'page' && format('Sim page tests in Chrome ({0})', matrix.label) || format('Boot sim maps ({0} core, shard {1}/{2})', matrix.core, matrix.shard, matrix.of) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # Every shard reports, so one failing map does not hide the others.
      fail-fast: false
      matrix:
        include:
          # Default core: 21 cases, 7 a shard. The launch-screen checks run in 1/3.
          - { suite: boot, core: bf, shard: 1, of: 3 }
          - { suite: boot, core: bf, shard: 2, of: 3 }
          - { suite: boot, core: bf, shard: 3, of: 3 }
          # ?core=js: 13 cases, 7 and 6.
          - { suite: boot, core: js, shard: 1, of: 2 }
          - { suite: boot, core: js, shard: 2, of: 2 }
          # tools/test_sim_csp.mjs, both cores in one run.
          - { suite: csp, core: both, shard: 1, of: 1 }
          # Page tests' Chrome parts. About 4 and 3.5 minutes on a Windows
          # desktop; split so each entry stays under about 10 here.
          - { suite: page, label: 'easy mode', tests: 'tools/test_sim_easy_mode.mjs' }
          - { suite: page, label: 'first flight, coach', tests: 'tools/test_sim_first_flight.mjs tools/test_sim_coach_page.mjs' }
          # Gap Hunt's page part: three maps, bf and js cores each.
          - { suite: page, label: 'gap hunt', tests: 'tools/test_sim_gap_hunt.mjs' }
          # Speed units: the OSD's SPD line by language, each option, one width.
          - { suite: page, label: 'speed units', tests: 'tools/test_sim_speed_units.mjs' }
          - { suite: page, label: 'radio detect', tests: 'tools/test_sim_radio_detect.mjs' }
          # Pilot feedback fixes: the quad on the THR/BATT card, a new pack
          # (P, the NEW PACK tap target, the menu), Tune's classic-physics gate
          # flown on bf (bit-identical with each hidden control at both ends),
          # and arming while Betaflight loads; a desktop and two phone layouts.
          - { suite: page, label: 'pilot fixes', tests: 'tools/test_sim_pilot_fixes_page.mjs' }
          # The stick overlay, shared track links and track boards in Chrome,
          # and the track boards' Worker on wrangler dev (wrangler: true).
          - { suite: page, label: 'sticks, track links, track boards', tests: 'tools/test_sim_stick_overlay.mjs tools/test_sim_track_url.mjs tools/test_sim_track_boards.mjs tools/test_leaderboard_track_boards.mjs tools/test_leaderboard_builtin_boards.mjs', wrangler: true }
          # Tune's rates: on bf, presets, sliders, a paste, class changes,
          # reloads, links, the input default and the js carry, read back from
          # Betaflight; and the one profile across 65, 75 and 85 on both cores.
          # About 1.5 minutes on a Linux box with SwiftShader.
          - { suite: page, label: 'rates, counts', tests: 'tools/test_sim_bf_rates_page.mjs tools/test_sim_rates_page.mjs tools/test_leaderboard_counts.mjs tools/test_sim_count_page.mjs', wrangler: true }
          # The race offer in free flight (30 s in the air, T or RACE, the Rig
          # Loop) and the race count at gate 0; a desktop and a phone at three
          # sizes. About 2.5 minutes on a Windows desktop.
          - { suite: page, label: 'race offer', tests: 'tools/test_sim_race_offer_page.mjs' }
          # The music: no audio with the page for a returning visitor with
          # the music on, the first gesture and N each fetch and play one
          # track (title and artist in the toast), every listed file plays,
          # the credits are on the page.
          - { suite: page, label: 'music', tests: 'tools/test_sim_music.mjs' }
          # First flights: the input pick (touch on a desktop and back, a pad
          # set aside), a controller that cannot arm says why (pad deadzones,
          # a radio's check, Calibrate), the arm frame's flash and tones on
          # both cores. About 2.5 minutes on a Windows desktop.
          - { suite: page, label: 'input and arm', tests: 'tools/test_sim_input_arm_page.mjs' }
          # The keys' hover spring flown by a 400 ms novice (30 s in the air,
          # no crash, a landing on S, W again), nothing over the No controller
          # card, early clicks on a 1.6 Mbps load, no WebGL. About 3 minutes
          # on a Windows desktop.
          - { suite: page, label: 'keys hover', tests: 'tools/test_sim_keys_hover.mjs' }
          # A finish to a name on a board: the result card (the name, Post,
          # the board with the pilot's row lit), a named pilot's next finish
          # posted with no card, Not now, the menu's Pilot name, a builder
          # track, the weekly, a refused run's reason line, a taken name; a
          # desktop and a phone at three sizes. Its runs flown armed by the
          # autopilot (and at held frame rates) skip here: they need even
          # frames and a GPU, local only. About 8 minutes on a Windows desktop.
          - { suite: page, label: 'finish and name', tests: 'tools/test_sim_finish_name_page.mjs' }

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Locate Chrome
        run: |
          set -euo pipefail
          if ! command -v google-chrome >/dev/null && ! command -v google-chrome-stable >/dev/null; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable)"
          "$CHROME_BIN" --version
          echo "CHROME=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Boot this shard's maps
        if: matrix.suite == 'boot'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SIM_BOOT_CORE: ${{ matrix.core }}
          SIM_BOOT_SHARD: ${{ matrix.shard }}/${{ matrix.of }}
        run: node --test tools/test_sim_map_boot.mjs

      # wrangler for the rooms and leaderboard Workers under `wrangler dev`
      # (tools/sim_rooms_dev.mjs finds it here), for the csp entry and any
      # entry with wrangler: true. Without it those tests skip their
      # wrangler steps. Pinned to the version the tests were verified with:
      # there is no lockfile, and a new 4.x could change the flags or the
      # "Ready on" line the tests wait for.
      - name: Install wrangler
        if: matrix.suite == 'csp' || matrix.wrangler
        working-directory: workers/sim-rooms
        run: npm install --no-audit --no-fund --no-save wrangler@4.151.1

      - name: The sim under its Content-Security-Policy
        if: matrix.suite == 'csp'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: node --test tools/test_sim_csp.mjs

      # Each file on its own, Chrome parts included; all run even if one fails.
      - name: This entry's page tests
        if: matrix.suite == 'page'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          TESTS: ${{ matrix.tests }}
        run: |
          failed=()
          for f in $TESTS; do
            echo "::group::$f"
            start=$(date +%s)
            if node --test "$f"; then
              echo "PASS $f in $(( $(date +%s) - start )) s"
            else
              echo "::error file=$f::test file failed"
              echo "FAIL $f in $(( $(date +%s) - start )) s"
              failed+=("$f")
            fi
            echo "::endgroup::"
          done
          for f in "${failed[@]}"; do echo "FAIL $f"; done
          [ "${#failed[@]}" -eq 0 ]

  asset-stamps:
    name: Check asset cache stamps
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Check first-party asset stamps
        run: python scripts/ci/stamp_asset_cache.py --check
